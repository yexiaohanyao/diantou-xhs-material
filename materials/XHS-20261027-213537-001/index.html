绕毕业要求来。保持自己的节奏，以目标为导向，其他都是无意义的内耗\\n导师怎么看你，同门怎么想你，都没意义\\n将军赶路，不追小兔\\n.\\n❷永远不要去责备和批评自己。你可能会问，难道做错事了也不要批评自己吗？是的\\n我刚读研的时候很喜欢批评自己。实验做不出来，论文被拒稿，没get到导师意思，就觉得自己很差\\n但我后来发现，这其实是一种偷懒。它把一个具体的问题，直接变成了对人的否定。你以为自己在负责，其实只是陷在情绪里，这种负担重到没有能量再去解决问题\\n你要解决的，从来不是我是不是不行，而是一件又一件具体的事\\n.\\n❸文献要持续读，但不要只记自己读了多少篇。学会围绕一个具体问题，把几篇论文读成自己的判断。这样不管是读博还是实习，都会游刃有余\\n我最近梳理课题时，试着把相关论文放进专门的科研 Agent，让它先列出各篇研究的问题、关键实验和对应图表，再比较哪些结论能互相支持、哪些地方还缺证据。我会回到原文核对，把说得太满的地方改掉，最后留下几个能拿去和导师讨论的问题。它帮我省的是第一轮整理和对照文献的时间；研究方向和实验怎么定，仍要自己判断\\n注意，需要是专门的科研 Agent，因为他们跟通用大模型不同，是专门为科研任务设计的\\n做生物医学相关课题的同学，如果也卡在文献梳理这一步，可以拿手边正在读的论文免费试试。而且趁着研一大家都还没成果，这时候也是拿国奖的好时机\\n.\\n❹多开口问\\n很多事你不开口，没人主动告诉你。进组之后，尽快搞清楚课题组有多少人，主要研究方向有哪些，组里有什么资源可以用\\n比如实验室怎么样，有几台服务器，和哪些组有联系，导师在圈子里是什么地位，能不能链接企业或学术界，组里的生态如何，师兄师姐毕业一般去哪，你的方向在课题组是不是核心方向，有哪些师兄师姐和你方向相似，有哪些课题组可能和你竞争\\n.\\n❺不要等\\n我们都太喜欢等了，总想着准备好了再行动，变优秀了再自信，等到别人认可了再开始\\n但生命中所有事物都有保质期，机会转瞬即逝。不要把人生一直放在等待里。你现在就可以去查培养方案、读第一篇文献、问第一个问题、写下第一个计划\\n\\t\\n#科研Agent[话题]# #科研[话题]# #读研[话题]#\"}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-sm font-semibold\",\"children\":\"制作进度\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-xs leading-5 text-[#5e564e]\",\"children\":\"洗稿人可以有多位，用顿号分开，和收集人不是同一个角色。状态是展示、洗稿想法、洗稿完成、优秀稿件。静态展示只读，这里不能改。\"}]]}],[\"$\",\"dl\",null,{\"className\":\"grid grid-cols-[6.5rem_minmax(0,1fr)] gap-y-3 text-sm\",\"children\":[[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"洗稿人\"}],[\"$\",\"dd\",null,{\"children\":\"未指派\"}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"状态\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"span\",null,{\"className\":\"inline-flex items-center rounded-sm px-1.5 py-0.5 text-[11px] leading-4 bg-[#efe7da] text-[#5c534c]\",\"children\":\"展示\"}]}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"备注\"}],[\"$\",\"dd\",null,{\"className\":\"whitespace-pr

码蛋白质的区域（分 5'UTR 和 3'UTR），属于外显子但不干活，专门负责调控：\\n5'UTR 帮核糖体启动翻译；\\n3'UTR 管 mRNA 稳定性和翻译效率\\n🔹ORF（开放阅读框）\\n理论上 “可能编码蛋白质” 的序列（从起始到终止密码子），但不一定真能用！\\n✨ 关键：CDS 是实际编码的 ORF，但 ORF 不一定都是 CDS（很多是无效序列）\\n\\t\\n📗一句话总结关系✔️\\n外显子 + 内含子决定 mRNA 组成，UTR 管调控、CDS 管编码，ORF 是潜在编码区，而 CDS 是其中真正 “干活” 的～\\n\\t\\n[偷笑R]其实基因术语不用死记硬背，理清逻辑就超简单！💗起来随时查～\\n\\t\\n#外显子[话题]# #内含子[话题]# #科研小白[话题]# #分子生物学[话题]# #学习笔记[话题]# #基因科普[话题]# #生活需要分享欲[话题]#\"}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-sm font-semibold\",\"children\":\"制作进度\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-xs leading-5 text-[#5e564e]\",\"children\":\"洗稿人可以有多位，用顿号分开，和收集人不是同一个角色。状态是展示、洗稿想法、洗稿完成、优秀稿件。静态展示只读，这里不能改。\"}]]}],[\"$\",\"dl\",null,{\"className\":\"grid grid-cols-[6.5rem_minmax(0,1fr)] gap-y-3 text-sm\",\"children\":[[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"洗稿人\"}],[\"$\",\"dd\",null,{\"children\":\"未指派\"}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"状态\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"span\",null,{\"className\":\"inline-flex items-center rounded-sm px-1.5 py-0.5 text-[11px] leading-4 bg-[#efe7da] text-[#5c534c]\",\"children\":\"展示\"}]}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"备注\"}],[\"$\",\"dd\",null,{\"className\":\"whitespace-pre-wrap\",\"children\":\"—\"}]]}],[\"$\",\"p\",null,{\"className\":\"text-xs text-[#8a7f74]\",\"children\":\"还没有更新过\"}]]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n8:null\n"])</script><script>self.__next_f.push([1,"19:I[6644,[],\"IconMark\"]\na:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"点头素材台\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"点头教育内部素材库与制作进度\"}],

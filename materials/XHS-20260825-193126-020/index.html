别错过\\n①国考是国家公务员，“吃中y财z饭”\\n②不容置疑是公考当中最难的，体现在题量太多，时间较为紧张\\n③一般10月中旬报名，11月下旬或12月初考试，面试在来年3月左右，举行时间是非常固定的\\n④考试科目为行测与申论，申论分省级以上和副省及以下两类\\n\\t\\n2️⃣省考\\n与国考考察内容一样，考完国考再去考省考，上岸机会非常大\\n①省考是省管公务员，“吃地方财z饭”，纳入地方公务员序列\\n②比国考相对题目简单一些，题量也少一点点\\n③多省联考在3-6月之间举行，北上广江浙鲁在11月-1月\\n④省考和事业单位报考条件大致相同，专科以上就 可以报考(各省具体情况有区别，部分省份/部门/单位会有特殊要求)，应届与非应届均可参考\\n\\t\\n3️⃣事业单位\\n与考公的内容有重合，但难度系数较低，应届生可报考的岗位很多\\n①事业单位考试时间各省市并不统一，一年四季都有招聘，只要想考基本都会有事业单位在招聘\\n②专科以上就可以报考(各省具体情况有区别，部分省份/部门/单位会有特殊要求)，应届与非应届均可参考\\n\\t\\n📌最后提醒：\\n1、上面这些考试机会能都参加就都参加，多一次考试就多一次上岸的机会\\n2、大二大三和研二研三想考公的一定要把握好应届生身份！当年应届就只有一次\\n#考公 #公考 #公务员 #省考 #公务员考试 #国考 #选岗 #考公考编 #研究生考公 #考公考研\\n02-27\"}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-sm font-semibold\",\"children\":\"制作进度\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-xs leading-5 text-[#5e564e]\",\"children\":\"洗稿人可以有多位，用顿号分开，和收集人不是同一个角色。状态是展示、洗稿想法、洗稿完成、优秀稿件。静态展示只读，这里不能改。\"}]]}],[\"$\",\"dl\",null,{\"className\":\"grid grid-cols-[6.5rem_minmax(0,1fr)] gap-y-3 text-sm\",\"children\":[[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"洗稿人\"}],[\"$\",\"dd\",null,{\"children\":\"未指派\"}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"状态\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"span\",null,{\"className\":\"inline-flex items-center rounded-sm px-1.5 py-0.5 text-[11px] leading-4 bg-[#efe7da] text-[#5c534c]\",\"children\":\"展示\"}]}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"备注\"}],[\"$\",\"dd\",null,{\"className\":\"whitespace-pre-wrap\",\"children\":\"—\"}]]}],[\"$\",\"p\",null,{\"className\":\"text-xs text-[#8a7f74]\",\"children\":\"还没有更新过\"}]]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n8:n

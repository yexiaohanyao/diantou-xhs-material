科方向的科研。\\n先说结论：不是因为跟风，是因为真的有用。\\n📍 我为什么开始学\\n大二开始接触科研之后，最大的感受是——\\n文献量太大了。\\n一个课题方向，PubMed 一搜几百上千篇。逐篇筛、逐篇读，效率极低。后来我用 AI 工具做文献筛选和摘要提取，效率至少翻倍，而且不会再漏掉关键文献。\\n第二个原因是，眼科本身就高度依赖影像学。OCT、眼底照、视野检查……全部是图像数据。AI 在医学影像上的应用已经非常成熟了，如果完全不懂，以后连跟导师讨论都插不上话。\\n所以你说，医学生学AI是卷吗？\\n我觉得是，必要。\\n📍 我在学什么（现阶段）\\n直接说我在用的：\\n工具层面：\\nChatGPT / Claude：文献阅读辅助、思路梳理\\nPython 基础 + Jupyter Notebook：帮自己做一些简单的数据整理\\nZotero + AI 插件：文献管理\\n知识层面：\\n吴恩达的 Machine Learning 入门课（B站有）\\n医学影像AI相关的综述文献精读\\n每周抽时间看 1-2 篇 AI for Medicine 方向的最新 paper\\n不求深入，先建立框架认知。够用就行。\\n📍 学了之后，到底有什么用\\n说两个真实的场景：\\n场景一：文献综述 以前花 2 小时筛文献 → 现在 30 分钟。 AI 帮你初筛，你负责精读和判断。省下来的时间可以用来思考。\\n场景二：和导师/师兄师姐交流 当你能说出「这个模型在 OCT 图像分割上的 Dice 系数比传统方法高了几个点」的时候，对方对你的重视程度是不一样的。\\n是沟通效率。\\n📍 给也想开始学的医学生，三点建议\\n不要一上来就啃理论，先从解决具体问题开始（比如「怎么快速读完 10 篇文献」），再倒推需要学什么\\n别怕英语，好的资料基本都是英文的，读着读着就习惯了，顺便练了英语\\n不需要成为程序员，会调用工具、能看懂代码就够了——你是用AI，不是造AI\\n📍 写在最后\\n说实话，我也没有完全想清楚未来要怎么走。\\n牛津是个方向，眼科科研是现在在做的事情。AI 穿插在中间，既是工具，也是一个可能性。\\n但有一件事是确定的：早一步开始，就多一分选择权。\\n\\t\\n#医学生的日常[话题]# #AI学习[话题]# #湘雅医学院[话题]# #眼科科研[话题]# #医学僧[话题]# #申请牛津[话题]# #医学影像AI[话题]# #医学生成长[话题]#\"}],\"$L15\"]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"15:[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-sm font-semibold\",\"children\":\"制作进度\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-xs leading-5 text-[#5e564e]\",\"children\":\"洗稿人可以有多位，用顿号分开，和收集人不是同一个角色。状态是展示、洗稿想法、洗稿完成、优秀稿件。静态展示只读，这里不能改。\"}]]}],[\"$\",\"dl\",null,{\"className\":\"grid grid-cols-[6.5rem_minmax(0,1fr)] gap-y-3 text-sm\",\"children\":[[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"洗稿人\"}],[\"$\",\"dd\",null,{\"children\":\"未指派\"}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"状态\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"span\",null,{\"className\":\"inline-flex items-center rounded-sm px-1.5 py-0.5 text-[11px] leading-4 bg-[#efe7da] text-[#5c534c]\",\"children\":\"展示\"}]}]

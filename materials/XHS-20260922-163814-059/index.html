"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"原文\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.xiaohongshu.com/explore/6aa9eedd000000002700a538\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"className\":\"break-all text-[#9f2d20] underline-offset-2 hover:underline\",\"children\":\"https://www.xiaohongshu.com/explore/6aa9eedd000000002700a538\"}]}]]}],[\"$\",\"div\",null,{\"className\":\"mt-4 flex flex-wrap gap-1\",\"children\":[[[\"$\",\"span\",\"经历分享 | 观点输出\",{\"className\":\"inline-flex items-center rounded-sm border border-[#e3d8c8] bg-[#f7f1e7] px-1.5 py-0.5 text-[11px] leading-4 text-[#5c534c]\",\"children\":\"经历分享 | 观点输出\"}]],[]]}],[\"$\",\"p\",null,{\"className\":\"mt-4 flex gap-4 text-sm tabular-nums text-[#5e564e]\",\"children\":[[\"$\",\"span\",null,{\"children\":[\"赞 \",129]}],[\"$\",\"span\",null,{\"children\":[\"藏 \",13]}],[\"$\",\"span\",null,{\"children\":[\"评 \",3]}]]}],[\"$\",\"p\",null,{\"className\":\"mt-4 whitespace-pre-wrap text-sm leading-7\",\"children\":\"读研读博的这几年，我最深的体会就是你以为自己是在淋雨赶路，实际上那是导师站在你脖子上撒尿，还告诉你这叫成长的洗礼。\\n\\t\\n刚进实验室那会儿，我真信了为科学献身那套。每天早上八点到位，晚上十一点离开，觉得这是在为自己奋斗。直到看见师兄通宵改不知道第几版的论文，导师扫了一眼说“重写吧，我感觉不对”那一刻我才明白，有些雨下得毫无道理。\\n\\t\\n有个同门做实验。连续三个月数据完美，导师每次组会都说“再验证一下”。最后发现导师根本看不懂他的新方法，但就是不承认。后来我们聊天时说破了，他不是在指导你，他是在用你的青春验证他的权威。\\n\\t\\n文科的朋友更惨。导师接的横向课题，让学生写稿、做调研、出书，最后署名时学生名字像被雨水冲掉了一样。美其名曰团队协作，实则是你淋雨，他打伞。\\n\\t\\n更绝的是那套话术：“现在苦一点，将来就好了”、“都是这么过来的”、“这是在培养你”。翻译成人话就是：我站着，你跪好。\\n\\t\\n但你知道吗？最可怕的不是被欺负，而是居然慢慢习惯了这种天气。习惯了随时待命，习惯了成果被拿走，甚至开始自我怀疑，是不是我真的不够努力？是不是这场雨就该我淋？\\n\\t\\n哪有什么雨中前行，分明是踩着我们的脖子过河。他们把自己的KPI、职称、项目经费，都浇灌在我们的痛苦之上。\\n\\t\\n所以现在每当有学弟学妹问我读研读博的感受，我都会说：准备好，这不是知识的远征，这是权力的游戏。你能做的，要么在暴雨中学会游泳，要么看清这根本不是雨，是有人在上面撒尿。\\n\\t\\n但记住，毕业那天，这场尿总会停的。而带着一身味道走出去的你，至少能一眼认出什么是真正的雨，什么是人渣。这身湿透的衣服终会干，但看透这套把戏的眼睛，再也不会被蒙蔽。\\n#博士生[话题]# #都说博士读的就是心态[话题]# #当代研究生精神状态[话题]# #研究生[话题]# #当代研究生现状[话题]# #当代博士生的精神状态[话题]# #抽象[话题]#\"}],[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[[\"$\",\"

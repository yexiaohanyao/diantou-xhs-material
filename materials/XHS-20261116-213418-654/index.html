,\"target\":\"_blank\",\"rel\":\"noreferrer\",\"className\":\"break-all text-[#9f2d20] underline-offset-2 hover:underline\",\"children\":\"https://www.xiaohongshu.com/explore/6aeedbc4000000001a0178e3?xsec_token=ABimz4L95wTv83VzPGhmpxkh4DEquA0izwKEU0M_zw5LA=\u0026xsec_source=pc_search\u0026source=web_explore_feed\"}]}]]}],null,\"$L15\",\"$L16\",\"$L17\"]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"15:[\"$\",\"p\",null,{\"className\":\"mt-4 flex gap-4 text-sm tabular-nums text-[#5e564e]\",\"children\":[[\"$\",\"span\",null,{\"children\":[\"赞 \",8759]}],[\"$\",\"span\",null,{\"children\":[\"藏 \",6681]}],[\"$\",\"span\",null,{\"children\":[\"评 \",59]}]]}]\n18:Tb0e,"])</script><script>self.__next_f.push([1,"用一个例子讲清楚，深度思考是如何进行的。\n我不认为深度思考是一种天赋，我更愿意把它理解为一个有迹可循的过程。\n今天提出的问题：为什么明明很努力，却还是无法改变自己的生活？\n\t\nStep 1:从一个问题出发\n1.从一个现象出发，不急着下结论\n最初看到这个问题，我脑海里可能会冒出很多答案：\n努力的方向不对;\n缺乏有效的方法;\n所处的环境限制了发展;\n没有足够的资源和机会;\n认知水平不足。\n一个复杂的现象往往不是单一原因造成的。\n2.把现象和解释分开\n现象：一个人付出了很多努力，但生活没有发生明显改变。\n解释：可能是方向、方法、环境、资源或者其他因素造成的。\n\t\nStep 2：不断追问，把模糊的问题具体化\n1.将大问题拆解成小问题\n问题越具体，越容易找到真正值得研究的地方：\n一个人的努力具体投入在哪里？\n这些投入能不能转化成实际价值？\n为什么投入和回报之间可能存在差距？\n哪些因素是个人能够改变的，哪些不是？\n2.寻找不同的解释\n比如，同样是努力却没有改变生活，可以从四个角度理解：\n个人能力：没有形成能够创造价值的能力。\n选择与方向：投入很多在错误的事情。\n环境：需要通过环境和平台才能转化。\n资源与机会：需要资金、人脉、信息和进某个领域的机会。\n\t\nStep 3：寻找事物底层逻辑\n1.寻找反例，主动攻击自己的观点\n假设我现在形成了一个观点：\n「一个人努力却没有结果，主要是因为方向不对。」\n那么我会反过来问自己：\n有没有人方向正确，但因为资源不足而失败？\n有没有人方向并不完美，却通过持续积累获得了成功？\n当我开始寻找反例，就有可能发现原来的观点过于简单。\n2.寻找事物的底层逻辑练习\n进行逆向思维训练这一段我认为很重要，我会运用到人际交往中，有时候一个人说的话并不是代表他的真实想法，也许是因为恐惧什么或者是想获取什么。\n\t\nStep 4：形成结论，并保留空间\n经过前面的拆解，现在可以形成一个阶段性结论：\n一个人努力却无法改变生活，不一定是因为不够努力，而是努力并不会自动转化成结果。\n但我不会认为这就是最终答案。\n如果以后接触到新的东西，或者经历了不同的人生阶段，我可能还会修正今天的判断。\n不是为了得到一个永远正确的答案，而是不断提高自己理解问题的能力。\n\t\n#howto修炼提问力[话题]# #深度思考[话题]# #自我提升[话题]# #思维方式[话题]# #底层逻辑[话题]# #个人成长[话题]# #持续学习与成长[话题]# #思考与行动[话题]#"])</script><script>self.__next_f.push([1,"16:[\"$\",\"p\",null,{\"className\":\"mt-4 whitespace-pre-wrap text-sm leading-7\",\"children\":\"$18\"}]\n"])</script><script>self.__next_f.push([

DeepSeek创始人梁文锋，浙大的本加硕。\\n\\t\\n他是为数不多兼具金融算法实力+大模型自研能力的创业者。当年DeepSeek在国内一出，立马改变了无数人的生活工作方式，同时DeepSeek也是当前对标国际头部厂商、出海影响力极强的国产大模型企业，成为浙大AI创业圈最具代表性的项目之一。\\n\\t\\n再来看熊蓉，浙大本硕博一条龙，机器人实验室主任，RoboCup国际理事，福布斯中国科技女性上榜者，多的名号咱就不说了，一句话和你讲明白她的研究，是她领头打破了通用大模型与机器人的技术壁垒，例如对扫地机器人下指令，大模型可以把你的口头指令转化为对应的机器人指令，再让机器人去执行。所以你有没有发现，现在的机器人越来越聪明了，从最初的指令识别，变得能听懂人话了。\\n\\t\\n除了梁文锋、熊蓉之外，xAI前核心研究员张国栋、机器狗研发专家朱秋国、空间AI创始人黄晓煌等人，都来自浙大。浙大校友构建了从底层算力、通用大模型，到实体机器人，再到各行各业AI应用的完整产业版图。可以说浙大既是国内AI产业最重要的人才摇篮，也是连接中美人工智能技术交流的中坚力量。\\n\\t\\n不得不感慨，浙大这步棋太有远见卓识了。别家还在摸索计算机学科时，他们就已经着手AI领域了，关键是还真的让这群人抓住了。看看浙大这帮校友，国内创业热火朝天，海外顶尖实验室也是频频出没。论AI产业化落地，这帮人是绝对的中坚力量。且看吧，浙大校友在AI界的影响力只会随着AI领域的进一步发展水涨船高。\\n\\t\\n#AI[话题]# #科技[话题]# #浙大[话题]#\"}],\"$L15\"]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"15:[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-sm font-semibold\",\"children\":\"制作进度\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-xs leading-5 text-[#5e564e]\",\"children\":\"洗稿人可以有多位，用顿号分开，和收集人不是同一个角色。状态是展示、洗稿想法、洗稿完成、优秀稿件。静态展示只读，这里不能改。\"}]]}],[\"$\",\"dl\",null,{\"className\":\"grid grid-cols-[6.5rem_minmax(0,1fr)] gap-y-3 text-sm\",\"children\":[[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"洗稿人\"}],[\"$\",\"dd\",null,{\"children\":\"未指派\"}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"状态\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"span\",null,{\"className\":\"inline-flex items-center rounded-sm px-1.5 py-0.5 text-[11px] leading-4 bg-[#efe7da] text-[#5c534c]\",\"children\":\"展示\"}]}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"备注\"}],[\"$\",\"dd\",null,{\"className\":\"whitespace-pre-wrap\",\"children\":\"—\"}]]}],[\"$\",\"p\",null,{\"className\":\"text-xs text-[#8a7f74]\",\"children\":\"还没有更新过\"}]]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"v

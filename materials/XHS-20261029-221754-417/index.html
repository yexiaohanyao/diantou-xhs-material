心数学推导过程是什么（让0基础的我从理论视角理解方法）？如果有，请给我补充理论背景（我的数学比较差），告诉我理论的基础和intuition；如果没有，可以说明并跳过这一点\n\t\n7. 这篇论文是如何设计实验来验证提出的方法和claim的？按照下面格式总结：提出了什么问题-\u003e设计了什么实验验证这个问题-\u003e问题的答案是什么。不需要很多数据细节，只需要核心思路\n\t\n8. 总结这篇论文的take-aways\n\t\n9. 【重要】这篇论文最脆弱的假设是什么？\n\t\n10. 如果我有1周时间，能做一个最小复现实验验证它的哪一点？\n\t\n11. 【重要】如果我反对它，我会怎么设计反例？\n\t\n12. 调研、思考、基于你的信息提出一个follow up的idea，要novel，不是增量研究，是从方法缺陷Limitation和需求出发思考可能的新的有价值的研究\n\t\n我认为3是最重要的，但又被很多人忽略。\n我用AI总结论文收获最大的往往不是论文方法本身（毕竟大多数方法几个月后可能就过时了），而是作者是如何被启发的。\n读论文要反向推理作者的思考过程，才能锻炼基于related work和inspiration提出idea的能力。\n\t\n所以要按照上面的顺序总结，先了解背景，然后尝试自己思考，如果你是作者的话能不能想到解决方法，再结合AI逆向蒸馏作者的思考过程，然后修正你的思考。（这类似一种meta learning，学习如何做research，而非被论文细节干扰）\n\t\n9-12也很重要。我们要看这篇论文最大的限制，如何最小复现核心claims，如何反例设计攻击它，然后尝试提出新的ideas。\n\t\n补充要求：\n* 风格参考Andrej Karpathy和Kaiming He，要求有真人的语感\n* 使用详细的、准确的claim，每句话都要有信息量，避免大空话和泛泛而谈\n* 使用流畅的文本，避免滥用破折号、引号，保持输出内容清洁流畅，易读性高\n* 使用真人逻辑，避免使用[不是...而是]这种AI的低信息量结构\n* 请严格区分四类信息：论文原文明确声称的内容、相关文献中的已有结论、基于证据的合理推断、仍然不确定的猜测。不要把推断写成事实。\n\t\n个人实践经验：LLMs有上下文限制，一次完整总结12个问题可能会存在一些小细节缺失（但对我来说够用了，反正可以继续提问）；如果追求精度，可以每个问题单独提问，或者调用subagent单独处理，最后整合。\n\t\n更新：刚刚传到GitHub上了，总结了四种使用方法--直接给agent的skill版本；直接复制的instruction版本；取长补短合并到你之前已有的论文阅读prompt；针对人文社科优化指南（参考p2）\nhttps://github.com/FeijiangHan/PaperForge/\n\t\n这个版本还可以继续扩充和优化，大家取长补短即可[亲一个R]\n\t\n#大模型[话题]# #文献阅读[话题]# #viberesearch[话题]# #ai读文献[话题]# #prompt分享[话题]# #howto用好AI[话题]#"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$L11\",null,{\"current\":\"/library\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-xs text-[#5e564e]\",\"children\":[[\"$\",\"$L4\",null,{\"href\":\"/library\",\"className\":\"hover:text-[#9f2d20]\",\"children\":\"素材库\"}],[\"$\",\"span\",null,{\"className\":\"px-2\",\"children\":\"/\"}],\"详情\"]}],[\"$\",\"div\",null,{\"className\":\"mt-4 grid gap-6 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)]\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] border border-[#e3d8c8] bg-[#efe7da]\",\"children\":[\"$\",\"$L12\",null,{\"src\":\"/dian

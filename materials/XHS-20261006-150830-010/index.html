ms text-[#5e564e]\",\"children\":[[\"$\",\"span\",null,{\"children\":[\"赞 \",1975]}],[\"$\",\"span\",null,{\"children\":[\"藏 \",2269]}],[\"$\",\"span\",null,{\"children\":[\"评 \",139]}]]}]\n1c:Tab5,"])</script><script>self.__next_f.push([1,"我不是 AI 大神，也不是技术博主。\n我只是一个会被组会、论文、数据、图表、代码和 deadline 追着跑的普通博士(一周一次组会[哭惹R])。\n\t\n使用了Codex/ Claude Code这三个月，我的状态可以用两个字形容：上头！\n\t\n不是那种“哇AI好厉害”的新鲜感，是一种很具体的感觉/兴奋：以前脑子里有很多想法，但每个想法后面都跟着一长串磨人的中间环节——数据要清洗、代码要改、报错要查、图要重画、汇报要整理。现在第一次觉得，只要我能把问题说清楚，很多东西真的可以被做出来。\n\t\n以前 Python、R 、Latex、Quarto、GitHub、Git 等几乎是日常必备工具。做一张图，可能要先处理数据、匹配变量、写代码、调格式、检查结果。顺利的时候半天，不顺利一天可能也就折腾一两张。\n\t\n但用了 Codex / Claude Code 之后，工作方式开始变了。\n\t\n现在我更多是去描述目标：\n我想比较哪些样本，想看什么异质性，想看idea可能性，想批量画哪些图，想跑什么模型，然后让 Agent 去实现我的想法并迭代，我再负责判断结果靠不靠谱。\n\t\n这个变化对科研人来说很大。\n因为科研里最有价值的，其实是【提出问题、判断机制、解释结果】。但有体验过古早手搓code的科研人都知道，原来很多时间都会耗在中间模块化的重复执行上。\n\t\n当然，codex和cc并不是魔法。刚开始我也被安装、配置、账号、网络、API、MCP、skills、项目路径、会话交接卡过很多次，并且在没有配置好适用的skills和mcp时候也感受不到他们的强大。\n\t\n所以我越来越觉得，AI Agent 不是不用学习，而是对科研人综合判断力要求更高了。\n\t\n你要会拆任务，会查漏洞，会复核结果，把控它的运行边界。\n\t\n使用codex/cc融入科研过程后最明显的感受是，从“亲自操作的人”变成了“设计任务和验收结果的人”。\n\t\n以前有新想法🔥，我第一反应是：有时间再试\n现在我第一反应是：我让AI试试\n\t\n这可能就是我重新理解“科研效率”的开始。\nAI 不是替我思考，而是把我从很多重复执行里拉出来，让我有机会把精力重新放回问题、判断和创造上。\n\t\n🚶我还是一个普通科研博士，也还在学习路上。学习每天用一点AI，习以为AI❤️\n\t\nps：来自今日组会结束后的碎碎念分享[微笑R]\n#vibecoding[话题]# #科研效率[话题]# #codex[话题]# #ClaudeCode[话题]# #学术工具[话题]# #论文[话题]#  #研究生[话题]#  #我的博士学习[话题]# #howto用好AI[话题]# #howto入门codex[话题]#"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"p\",null,{\"className\":\"mt-4 whitespace-pre-wrap text-sm leading-7\",\"children\":\"$1c\"}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-sm font-semibold\",\"children\":\"制作进度\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-xs leading-5 text-[#5e564e]\",\"children\":\"洗稿人可以有多位，用顿号分开，和收集人不是同一个角色。状态是展示、洗稿想法、洗稿完成、优秀稿件。静态展示只读，这里不能改。\"}]]}],[\"$\",\"dl\",nul

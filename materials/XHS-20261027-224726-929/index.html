"className\":\"text-[#5e564e]\",\"children\":\"原文\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"a\",null,{\"href\":\"https://www.xiaohongshu.com/explore/6ad4af100000000027034179?xsec_token=ABOGEyfIHYDaMl7So_ChLYtMnUFid8zaLRUUDsIAHpE50=\u0026xsec_source=pc_share\u0026source=webshare\",\"target\":\"_blank\",\"rel\":\"noreferrer\",\"className\":\"break-all text-[#9f2d20] underline-offset-2 hover:underline\",\"children\":\"https://www.xiaohongshu.com/explore/6ad4af100000000027034179?xsec_token=ABOGEyfIHYDaMl7So_ChLYtMnUFid8zaLRUUDsIAHpE50=\u0026xsec_source=pc_share\u0026source=webshare\"}]}]]}],null,[\"$\",\"p\",null,{\"className\":\"mt-4 flex gap-4 text-sm tabular-nums text-[#5e564e]\",\"children\":[[\"$\",\"span\",null,{\"children\":[\"赞 \",2092]}],[\"$\",\"span\",null,{\"children\":[\"藏 \",2116]}],[\"$\",\"span\",null,{\"children\":[\"评 \",34]}]]}],[\"$\",\"p\",null,{\"className\":\"mt-4 whitespace-pre-wrap text-sm leading-7\",\"children\":\"今天组会集中看了几篇设计学硕博小论文，研究方向不同，但在研究思路和论文组织上遇到的问题很相似。整理了几个我觉得比较实用的建议，尤其适合正在写论文、准备中期检查或预答辩的同学\\n1️⃣ 培养问题意识，而不是急于确定研究内容\\n很多时候，我们习惯从“我想研究什么”出发，却忽略了“为什么这个问题值得研究”。这常导致我们完成一个研究后，这个研究问题其实是虚假的问题，没有真实的研究场景，自然会被质疑研究价值和创新性。建议在正式开展研究前，先问自己三个问题：已有研究解释了什么？还有什么没有解释清楚？我的研究准备推进哪一部分认识？先找到真正值得回答的问题，再决定研究什么、采用什么方法。\\n2️⃣ 文献综述要从整理文献转向建立论证\\n文献综述为研究问题服务，是推导的过程，不是无尽堆砌。学会给自己的研究现状或理论综述分层，将整段内容归纳一个核心观点。可以尝试在每个综述小节结束时回答：这些文献共同说明了什么？还有什么问题没有解决？和我的研究有什么关联？有哪些启发？\\n3️⃣ 厘清研究方法混合的必要性\\n很喜欢使用混合方法，脑电、眼动、内容分析、结构方程模型、机器学习混在一起，但实际方法没有回应问题，反而增加了研究问题的复杂程度。方法之间形成互补，比单纯增加方法数量更有价值。增加方法前思考一下，它回答了什么问题？提供了什么其他方法无法替代的证据？\\n4️⃣ 从统计结果中提炼真正的研究贡献\\n讨论与结论部分，也不要停留在重复显著性结果。可以再追问一步：这一发现与已有研究有什么不同？增加了什么新的认识？对于设计学研究，能否进一步形成设计原则、设计方法或可迁移的设计知识？\\n💡 一个最近越来越深的感受：\\n论文写作中，很多时候最值得花时间的，不是叠加文献、变量或分析方法，让论文看起来深奥或者复杂。而是反复梳理研究逻辑，打磨研究设计。今天评阅了四篇论文，其中三篇的研究设计存在比较严重的问题，导致已经收集的数据难以有效回答研究问题。前期投入了大量时间和精力，最后却很难形成有说服力的研究结论，实在有些可惜。所以问题意识很重要，应该贯穿研究的全过程。 在研究的不同阶段，都值得反复追问。把核心问题想透，把研究逻辑理顺，把研究设计做扎实，往往比增加内容更重要。\\n#研究生论文[话题]# #硕士毕业论文[话题]# #小论文[话题]# #论文初稿[话题]# #学术写作[话题]#\"}],[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[\"$L15\",\"$L16\",\"$L17\"]}]]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"15:[\"$\",\"div\",null,{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-sm font-semibold\",\"children\":\"制作进度\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-xs leading-5 text-[#5e564e]\",\"children\":\"洗稿人可以有多位，用顿号分开，和收集人不是同一个角色。状态是展示、洗稿想法、洗稿完成、优秀稿件。静态展示只读，这里不能改。\"}]]}]\n16:[\"$\",\"dl\",null,{\"className\":\"grid grid-cols-[6.5rem_minmax(0,1fr)] gap-y-3 text-sm\",\"children\":[[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"洗稿人\"}],[\"$\",\"dd\",null,{\"children\":\"未指派\"}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"状态\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"span\",null,{\"className\":\"inline-flex items-center rounded-sm px-1.5 py-0.5 text-[11px] leading-4 bg-[#efe7da] text-[#5c534c]\",\"children\":\"展示\"}]}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"备注\"}],[\"$\",\"dd\",null,{\"className\":\"whitespace-pre-wrap\",\"children\":\"—\"}]]}]\n17:[\"$\",\"p\",null,{\"className\":\"text-xs text-[#8a7f74]\",\"children\":\"还没有更新过\"}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n8:null\n"])</script><script>self.__next_f.push([1,"18:I[6644,[],\"IconMark\"]\na:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"点头素材台\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"点头教育内部素材库与制作进度\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/diantou-xhs-material/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"$L18\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"f:\"$a:metadata\"\n"])</script></body></html>

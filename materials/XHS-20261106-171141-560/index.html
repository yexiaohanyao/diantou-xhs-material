4 whitespace-pre-wrap text-sm leading-7\",\"children\":\"我最近深入研究了一份在 GitHub上的开源的 AI Agent学习地图，叫 awesome-agentic-ai-zh。这份地图专门为我们中文用户设计，逻辑清晰，路径明确，很容易上手。\\n\\t\\n今天，我就要把这份地图的核心拆解开来，分享给你。我将按照它的逻辑，把它拆解成 7 个阶段，每个阶段都有练习，也有建议学习时长（多少周）。\\n\\t\\n计划学习 Agent 的小伙伴，可以跟随这篇笔记，开始 AI Agent 的进阶之路。\\n\\t\\n好了，大家准备好了吗？咱们可发车了！！！\\n\\t\\n在学习之前，我们先明确一个核心的问题：对于 AI Agent，我到底是想成为一个“使用者”，还是一个“创造者”？\\n🤵使用者：你想成为一个绝地武士吗？\\n你对从零开始打造一把光剑的复杂物理原理不感兴趣。你想要的，是拿到一把像 Claude Code、Cursor、Devin 这样已经铸造好的、削铁如泥的利器，然后用它来让你的工作效率提升十倍、百倍。我们称这条路为 Track A：应用大师之路。\\n\\t\\n🧑‍💻创造者：你想成为一个绝地铸剑师吗？\\n你不仅想用剑，你更痴迷于光剑内部的凯伯水晶、能量循环、聚焦透镜。你渴望理解它背后的原理，甚至想亲手从零开始，打造一把拥有自己独特印记的、属于某个领域的定制宝剑。我们称这条路为 Track B：建造宗师之路。\\n\\t\\n这两条路，没有高下之分，只有方向不同。\\n\\t\\n很多人会选择先走完 Track A，成为一个熟练的剑客，然后再回头探索 Track B，去理解铸剑的奥秘。这非常合理。\\n\\t\\n但无论你最终的选择是什么，前三个阶段（Stage 0 到 Stage 2）是所有人的必修课。这就像无论是想成为剑客还是铸剑师，你都必须先完成体能训练、基础格斗和原力感知的入门，打下坚实的基础。\\n\\t\\n现在，让我们从新手村出发，踏上铸剑之旅。\\n#howto入门vibecoding[话题]# #AI产品经理[话题]# #agent[话题]# #智能体[话题]# #AI智能体[话题]# #AIAgent[话题]# #agent开发[话题]# #小红书科技AMA[话题]# #智能体搭建[话题]# #REDSkill[话题]#\"}],[\"$\",\"section\",null,{\"className\":\"mt-6 space-y-3 border-t border-[#e3d8c8] pt-5\",\"children\":[[\"$\",\"div\",null,{\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-sm font-semibold\",\"children\":\"制作进度\"}],[\"$\",\"p\",null,{\"className\":\"mt-1 text-xs leading-5 text-[#5e564e]\",\"children\":\"洗稿人可以有多位，用顿号分开，和收集人不是同一个角色。状态是展示、洗稿想法、洗稿完成、优秀稿件。静态展示只读，这里不能改。\"}]]}],[\"$\",\"dl\",null,{\"className\":\"grid grid-cols-[6.5rem_minmax(0,1fr)] gap-y-3 text-sm\",\"children\":[[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"洗稿人\"}],[\"$\",\"dd\",null,{\"children\":\"未指派\"}],[\"$\",\"dt\",null,{\"className\":\"text-[#5e564e]\",\"children\":\"状态\"}],[\"$\",\"dd\",null,{\"children\":[\"$\",\"span\",null,{\"className\":\"inline-flex items-center rounded-sm px-1.5 py-0.5 text-[11px] leading-4 bg-[#efe7da] text-[#5c534c]\",\"children\":\"展示\"}]}],\"$L1a\",\"$L1b\"]}],\"$L1c\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"
